<script>
KM_DATA.seed();
KM.route();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator) {
  const aviso = (w) => { document.getElementById('upd').style.display = 'flex'; document.getElementById('upb').onclick = () => w.postMessage('saltar'); };
  navigator.serviceWorker.register('sw.js').then((r) => {
    if (r.waiting && navigator.serviceWorker.controller) aviso(r.waiting);
    r.addEventListener('updatefound', () => { const n = r.installing; n.addEventListener('statechange', () => { if (n.state === 'installed' && navigator.serviceWorker.controller) aviso(n); }); });
    const chk = () => { try { r.update().catch(() => {}); } catch (e) {} };
    document.addEventListener('visibilitychange', () => { if (!document.hidden) chk(); });
    setInterval(chk, 120000);
    chk();
  });
  let rec = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (rec) return; rec = true; location.reload(); });

</script>
<script>
window.kmNotifDemo = async function () {
  try {
    if (!('Notification' in window)) return 'Este navegador no tiene notificaciones.';
    let p = Notification.permission;
    if (p === 'default') p = await Notification.requestPermission();
    if (p !== 'granted') return 'Permiso de notificaciones: ' + (p === 'denied' ? 'bloqueado. Actívalo en Ajustes de Android > Apps > KM Studio > Notificaciones.' : p);
    const r = await navigator.serviceWorker.ready;
    await r.showNotification('Edición · Promo hamburguesa', { body: 'Etapa: Cortes · 12:34', tag: 'km-demo', requireInteraction: true, silent: false, vibrate: [120, 60, 120], icon: './icons/icon-192.png', badge: './icons/favicon.png', data: { demo: true }, actions: [{ action: 'pausa', title: 'Pausar' }, { action: 'listo', title: 'Check ✓' }, { action: 'sig', title: 'Siguiente' }] });
    return 'Enviada. Bloquea la pantalla y mira si aparece.';
  } catch (e) { return 'Error: ' + e.message; }
};
</script>
<script>
window.kmPipDemo = async function () {
  try {
    const cv = document.createElement('canvas'); cv.width = 320; cv.height = 180;
    const g = cv.getContext('2d'); let t0 = Date.now(), run = true, paused = 0, stage = 1;
    const draw = () => { const sec = Math.floor(((run ? Date.now() : paused) - t0) / 1000); const m = String(Math.floor(sec / 60)).padStart(2, '0'), s = String(sec % 60).padStart(2, '0'); g.fillStyle = '#0c0e12'; g.fillRect(0, 0, 320, 180); g.fillStyle = '#c8f230'; g.font = '700 64px sans-serif'; g.textAlign = 'center'; g.fillText(m + ':' + s, 160, 100); g.fillStyle = '#e8eaee'; g.font = '600 18px sans-serif'; g.fillText('Promo hamburguesa', 160, 32); g.font = '500 16px sans-serif'; g.fillText('Etapa ' + stage + ' · ' + (run ? 'corriendo' : 'en pausa'), 160, 150); };
    draw(); const iv = setInterval(draw, 500);
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.srcObject = cv.captureStream(10); v.style.cssText = 'position:fixed;left:-9999px;width:2px;height:2px';
    document.body.appendChild(v); await v.play();
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: 'Promo hamburguesa', artist: 'Etapa 1 · Cortes', album: 'KM Studio' });
      const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
      set('pause', () => { paused = Date.now(); run = false; draw(); }); set('play', () => { t0 += Date.now() - paused; run = true; draw(); }); set('nexttrack', () => { stage++; draw(); });
    }
    if (!document.pictureInPictureEnabled) return 'Este navegador no abre imagen en imagen.';
    v.addEventListener('leavepictureinpicture', () => { clearInterval(iv); v.remove(); });
    await v.requestPictureInPicture();
    return 'Flotando. Sal de la app y mira si el cronómetro sigue corriendo.';
  } catch (e) { return 'No abrió: ' + e.message; }
};
</script>
<script>
(function () {
  const D = () => window.KM_DATA; let audio = null, last = [], key = '', ready = false;
  const silence = () => { const n = 8000, b = new ArrayBuffer(44 + n), v = new DataView(b); const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }; w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true); for (let i = 0; i < n; i++) v.setUint8(44 + i, 128); return URL.createObjectURL(new Blob([b], { type: 'audio/wav' })); };
  const remount = () => { try { if (window.KM && KM.app && KM.app.name) KM.mount(KM.app.name); } catch (e) {} };
  const find = (r) => { const it = D().items().find((x) => x.id === r.id); return it || null; };
  const ms = () => navigator.mediaSession;
  const act = (a, f) => { try { ms().setActionHandler(a, f); } catch (e) {} };
  const same = (a, b) => a.id === b.id && a.idx === b.idx;
  // Pausa y play actúan sobre todos los cronómetros activos. Siguiente cierra solo el último que iniciaste.
  function setup() {
    if (ready || !('mediaSession' in navigator)) return; ready = true;
    act('play', () => { if (!last.length) return; D().resumeAll(last); remount(); sync(); });
    act('pause', () => { const p = D().pauseAll(); if (p.length) last = p; remount(); sync(); });
    act('nexttrack', () => {
      const a = D().runs(); const r = a.length ? a[a.length - 1] : last[last.length - 1]; if (!r) return;
      D().stopRun(r.id, r.idx); D().finishNow({ id: r.id, idx: r.idx });
      const rest = (a.length ? a : last).filter((x) => !same(x, r)).map((x) => ({ id: x.id, idx: x.idx }));
      if (a.length > 1) { last = rest; remount(); sync(); return; }
      const it = find(r); const inf = it ? D().info(it) : null;
      last = rest.concat(inf && inf.cur >= 0 ? [{ id: r.id, idx: inf.cur }] : []);
      remount(); sync();
    });
    act('previoustrack', null); act('seekbackward', null); act('seekforward', null); act('seekto', null);
  }
  function sync() {
    try {
      if (!D() || !('mediaSession' in navigator)) return;
      const a = D().runs(); const on = a.length > 0;
      if (on) last = a.map((x) => ({ id: x.id, idx: x.idx }));
      last = last.filter((x) => { const it = find(x); return it && !(it.done || {})[x.idx]; });
      if (!last.length) { if (audio) { audio.pause(); } ms().metadata = null; ms().playbackState = 'none'; key = ''; return; }
      setup();
      if (!audio) { audio = new Audio(silence()); audio.loop = true; }
      const f = last[last.length - 1]; const it = find(f); const inf = D().info(it); const idx = f.idx; const stg = inf.stages;
      const k = last.map((x) => x.id + '|' + x.idx).join(',');
      if (k !== key) {
        key = k; const art = [{ src: 'icons/icon-192.png', sizes: '192x192', type: 'image/png' }];
        if (last.length === 1) ms().metadata = new MediaMetadata({ title: it.name + ' · ' + it.client, artist: 'Etapa ' + (idx + 1) + ' de ' + inf.n + ': ' + stg[idx], album: idx + 1 < inf.n ? 'Sigue: ' + stg[idx + 1] : 'Última etapa', artwork: art });
        else ms().metadata = new MediaMetadata({ title: last.length + ' cronómetros · ' + it.name, artist: last.map((x) => { const i2 = find(x); return i2 ? i2.name + ': ' + (D().info(i2).stages[x.idx] || '') : ''; }).join(' · '), album: 'Pausa y play controlan todos', artwork: art });
      }
      const r = a.find((x) => same(x, f));
      const secs = ((it.times || {})[idx] || 0) + (r ? Math.max(0, (Date.now() - r.start) / 1000) : 0);
      if (on) { if (audio.paused) audio.play().catch(() => {}); ms().playbackState = 'playing'; } else { if (!audio.paused) audio.pause(); ms().playbackState = 'paused'; }
      try { ms().setPositionState({ duration: 43200, position: Math.min(43199, secs), playbackRate: 1 }); } catch (e) {}
    } catch (e) {}
  }
  window.kmLock = { sync };
  setInterval(sync, 1000);
  document.addEventListener('click', () => setTimeout(sync, 150), true);
})();
</script>
<div id="idl" role="alertdialog" aria-live="assertive" style="position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);background:#1A1C22;color:#F2F3F5;border:1px solid #C6F432;border-radius:16px;padding:14px 16px;display:none;flex-direction:column;gap:10px;font:500 14px/1.45 system-ui;z-index:98;box-shadow:0 10px 30px rgba(0,0,0,.5)"><b id="idlT" style="font-size:16px"></b><span id="idlX"></span><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button id="idlA" style="display:flex;align-items:center;justify-content:center;height:48px;border:0;border-radius:12px;background:#C6F432;color:#0E0F13;font:600 14px system-ui"></button><button id="idlB" style="display:flex;align-items:center;justify-content:center;height:48px;border:0;border-radius:12px;background:#2A2D35;color:#F2F3F5;font:600 14px system-ui"></button></div></div>
<script>
// Corte automático del cronómetro. La regla vive en KM_DATA.idleCheck; aquí solo se muestra.
(function () {
  const D = () => window.KM_DATA; const $ = (i) => document.getElementById(i);
  let mode = '', warned = 0;
  const hm = (t) => { const d = new Date(t); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const mins = (s) => { const m = Math.round(s / 60); const h = Math.floor(m / 60); return h ? h + ' h' + (m % 60 ? ' ' + (m % 60) + ' min' : '') : m + ' min'; };
  const label = (r) => { const it = D().items().find((x) => x.id === r.id); if (!it) return ''; const st = (D().info(it).stages || [])[r.idx] || ''; return it.name + ' · ' + st; };
  const remount = () => { try { if (window.KM && KM.app && KM.app.name) KM.mount(KM.app.name); } catch (e) {} try { window.kmLock && kmLock.sync(); } catch (e) {} };
  const notify = (title, body) => { try { if (!document.hidden || !('Notification' in window) || Notification.permission !== 'granted') return; navigator.serviceWorker.ready.then((r) => r.showNotification(title, { body, tag: 'km-idle', renotify: true, vibrate: [120, 60, 120], icon: './icons/icon-192.png', badge: './icons/favicon.png' })).catch(() => {}); } catch (e) {} };
  const show = (m, t, x, a, b, fa, fb) => { mode = m; $('idlT').textContent = t; $('idlX').textContent = x; $('idlA').textContent = a; $('idlB').textContent = b; $('idlA').onclick = fa; $('idlB').onclick = fb; $('idl').style.display = 'flex'; };
  const hide = () => { mode = ''; $('idl').style.display = 'none'; };
  const openVideo = (id) => { try { const s = JSON.parse(localStorage.getItem('kmS.Proyecto') || '{}'); s.selId = id; s.view = 'detail'; localStorage.setItem('kmS.Proyecto', JSON.stringify(s)); } catch (e) {} if (location.hash === '#/Proyecto') { try { KM.mount('Proyecto'); } catch (e) {} } else location.hash = '#/Proyecto'; };
  function cutNotice() {
    let c = null; try { c = JSON.parse(localStorage.getItem('kmIdleCut') || 'null'); } catch (e) {}
    if (!c || !c.list || !c.list.length) return false;
    const first = c.list[0]; const more = c.list.length > 1 ? ' (y ' + (c.list.length - 1) + ' más)' : '';
    show('cut', 'El cronómetro se detuvo solo', label(first) + more + '. Guardé el tiempo hasta las ' + hm(c.at) + ' (' + mins(first.secs) + ' en esta tanda). Si trabajaste más, corrige el tiempo con presión larga sobre la etapa.', 'Corregir', 'Entendido',
      () => { localStorage.removeItem('kmIdleCut'); hide(); openVideo(first.id); },
      () => { localStorage.removeItem('kmIdleCut'); hide(); });
    return true;
  }
  function tick() {
    if (!D()) return;
    const r = D().idleCheck();
    if (r.state === 'cut') { remount(); notify('Cronómetro detenido', 'No respondiste. Se guardó hasta las ' + hm(r.cut.at) + '.'); warned = 0; cutNotice(); return; }
    if (r.state === 'ask') {
      const a = D().runs(); const more = a.length > 1 ? ' y ' + (a.length - 1) + ' más' : '';
      const txt = 'Llevas ' + r.cfg.every + ' min con ' + label(a[a.length - 1]) + more + '. Si no respondes antes de las ' + hm(r.deadline) + ', se guarda hasta las ' + hm(r.cfg.discount ? r.since : r.deadline) + ' y se detiene.';
      if (mode !== 'ask') {
        if (warned !== r.since) { warned = r.since; try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) {} notify('¿Sigues trabajando?', label(a[a.length - 1]) + more); }
        show('ask', '¿Sigues trabajando?', txt, 'Sí, sigo', 'Pausar', () => { D().idleYes(); hide(); }, () => { D().idleNo(); localStorage.removeItem('kmIdleCut'); remount(); hide(); });
      } else $('idlX').textContent = txt;
      return;
    }
    if (mode === 'ask') hide();
    if (!mode) cutNotice();
  }
  window.kmIdle = { tick };
  tick(); setInterval(tick, 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
})();
</script>
