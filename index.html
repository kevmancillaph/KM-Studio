<script>(function(){function f(){var v=window.visualViewport;var h=Math.round(v?v.height:window.innerHeight);document.documentElement.style.setProperty('--vh',h+'px');}f();window.addEventListener('resize',f);if(window.visualViewport)window.visualViewport.addEventListener('resize',f);window.addEventListener('orientationchange',function(){setTimeout(f,200)});})();</script>

<script>
KM_DATA.seed();
KM.route();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator) {
  const aviso = (w) => { document.getElementById('upd').style.display = 'flex'; document.getElementById('upb').onclick = () => w.postMessage('saltar'); };
  navigator.serviceWorker.register('sw.js').then((r) => {
    if (r.waiting && navigator.serviceWorker.controller) aviso(r.waiting);
    r.addEventListener('updatefound', () => { const n = r.installing; n.addEventListener('statechange', () => { if (n.state === 'installed' && navigator.serviceWorker.controller) aviso(n); }); });
    const chk = () => { try { r.update().catch(() => {}); } catch (e) {} };
    document.addEventListener('visibilitychange', () => { if (!document.hidden) chk(); });
    setInterval(chk, 120000);
    chk();
  });
  let rec = false; navigator.serviceWorker.addEventListener('controllerchange', () => { if (rec) return; rec = true; location.reload(); });
}
</script>
<script>
window.kmNotifDemo = async function () {
  try {
    if (!('Notification' in window)) return 'Este navegador no tiene notificaciones.';
    let p = Notification.permission;
    if (p === 'default') p = await Notification.requestPermission();
    if (p !== 'granted') return 'Permiso de notificaciones: ' + (p === 'denied' ? 'bloqueado. Actívalo en Ajustes de Android > Apps > KM Studio > Notificaciones.' : p);
    const r = await navigator.serviceWorker.ready;
    await r.showNotification('Edición · Promo hamburguesa', { body: 'Etapa: Cortes · 12:34', tag: 'km-demo', requireInteraction: true, silent: false, vibrate: [120, 60, 120], icon: './icons/icon-192.png', badge: './icons/favicon.png', data: { demo: true }, actions: [{ action: 'pausa', title: 'Pausar' }, { action: 'listo', title: 'Check ✓' }, { action: 'sig', title: 'Siguiente' }] });
    return 'Enviada. Bloquea la pantalla y mira si aparece.';
  } catch (e) { return 'Error: ' + e.message; }
};
</script>
<script>
window.kmPipDemo = async function () {
  try {
    const cv = document.createElement('canvas'); cv.width = 320; cv.height = 180;
    const g = cv.getContext('2d'); let t0 = Date.now(), run = true, paused = 0, stage = 1;
    const draw = () => { const sec = Math.floor(((run ? Date.now() : paused) - t0) / 1000); const m = String(Math.floor(sec / 60)).padStart(2, '0'), s = String(sec % 60).padStart(2, '0'); g.fillStyle = '#0c0e12'; g.fillRect(0, 0, 320, 180); g.fillStyle = '#c8f230'; g.font = '700 64px sans-serif'; g.textAlign = 'center'; g.fillText(m + ':' + s, 160, 100); g.fillStyle = '#e8eaee'; g.font = '600 18px sans-serif'; g.fillText('Promo hamburguesa', 160, 32); g.font = '500 16px sans-serif'; g.fillText('Etapa ' + stage + ' · ' + (run ? 'corriendo' : 'en pausa'), 160, 150); };
    draw(); const iv = setInterval(draw, 500);
    const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.srcObject = cv.captureStream(10); v.style.cssText = 'position:fixed;left:-9999px;width:2px;height:2px';
    document.body.appendChild(v); await v.play();
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: 'Promo hamburguesa', artist: 'Etapa 1 · Cortes', album: 'KM Studio' });
      const set = (a, f) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} };
      set('pause', () => { paused = Date.now(); run = false; draw(); }); set('play', () => { t0 += Date.now() - paused; run = true; draw(); }); set('nexttrack', () => { stage++; draw(); });
    }
    if (!document.pictureInPictureEnabled) return 'Este navegador no abre imagen en imagen.';
    v.addEventListener('leavepictureinpicture', () => { clearInterval(iv); v.remove(); });
    await v.requestPictureInPicture();
    return 'Flotando. Sal de la app y mira si el cronómetro sigue corriendo.';
  } catch (e) { return 'No abrió: ' + e.message; }
};
</script>
<script>
(function () {
  const D = () => window.KM_DATA; let audio = null, last = null, key = '', ready = false;
  const silence = () => { const n = 8000, b = new ArrayBuffer(44 + n), v = new DataView(b); const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); }; w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true); for (let i = 0; i < n; i++) v.setUint8(44 + i, 128); return URL.createObjectURL(new Blob([b], { type: 'audio/wav' })); };
  const remount = () => { try { if (window.KM && KM.app && KM.app.name) KM.mount(KM.app.name); } catch (e) {} };
  const find = (r) => { const it = D().items().find((x) => x.id === r.id); return it || null; };
  const ms = () => navigator.mediaSession;
  const act = (a, f) => { try { ms().setActionHandler(a, f); } catch (e) {} };
  function setup() {
    if (ready || !('mediaSession' in navigator)) return; ready = true;
    act('play', () => { if (!last) return; D().setRun(last, Date.now()); remount(); sync(); });
    act('pause', () => { const r = D().pauseNow(); if (r) last = r; remount(); sync(); });
    act('nexttrack', () => { const r = D().pauseNow() || last; if (!r) return; D().finishNow(r); const it = find(r); const inf = it ? D().info(it) : null; last = inf && inf.cur >= 0 ? { id: r.id, idx: inf.cur } : null; remount(); sync(); });
    act('previoustrack', null); act('seekbackward', null); act('seekforward', null); act('seekto', null);
  }
  function sync() {
    try {
      if (!D() || !('mediaSession' in navigator)) return;
      const r = D().getRun(); const run = r.run;
      if (run) last = run;
      if (!last) { if (audio) { audio.pause(); } ms().metadata = null; ms().playbackState = 'none'; key = ''; return; }
      const it = find(last); if (!it) { last = null; return; }
      const inf = D().info(it); if (inf.all) { last = null; return; }
      setup();
      if (!audio) { audio = new Audio(silence()); audio.loop = true; }
      const idx = last.idx; const stg = inf.stages;
      const k = it.id + '|' + idx; if (k !== key) { key = k; ms().metadata = new MediaMetadata({ title: it.name + ' · ' + it.client, artist: 'Etapa ' + (idx + 1) + ' de ' + inf.n + ': ' + stg[idx], album: idx + 1 < inf.n ? 'Sigue: ' + stg[idx + 1] : 'Última etapa', artwork: [{ src: 'icons/icon-192.png', sizes: '192x192', type: 'image/png' }] }); }
      const secs = ((it.times || {})[idx] || 0) + (run ? Math.max(0, (Date.now() - r.start) / 1000) : 0);
      if (run) { if (audio.paused) audio.play().catch(() => {}); ms().playbackState = 'playing'; } else { if (!audio.paused) audio.pause(); ms().playbackState = 'paused'; }
      try { ms().setPositionState({ duration: 43200, position: Math.min(43199, secs), playbackRate: 1 }); } catch (e) {}
    } catch (e) {}
  }
  window.kmLock = { sync };
  setInterval(sync, 1000);
  document.addEventListener('click', () => setTimeout(sync, 150), true);
})();
</script>
